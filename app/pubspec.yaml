name: lunote_app
description: "月笺 Lunote — 无云端、无账号、无互联网依赖的局域网通信与文件传输应用"
publish_to: 'none'

version: 1.5.4+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  # 本地补丁版：desktop_drop 0.4.4 写死 compileSdk 33，AGP 9 下 AAR 元数据检查失败
  desktop_drop:
    path: plugins/desktop_drop
  window_manager: ^0.4.2
  tray_manager: ^0.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# path_provider_foundation 2.5+ 依赖 objective_c（native assets）、
# path_provider_android 2.3+ 依赖 jni（需 SDK cmake 组件），
# 本产品不构建 macOS/iOS，且避免额外 SDK 组件，固定到经典实现版本
dependency_overrides:
  path_provider_foundation: 2.4.1
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
