[package]
name = "lunote-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "月笺 Lunote FFI 桥接层：UI（Flutter）通过 C ABI 调用核心"

[lib]
name = "lunote_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
lunote-core = { path = "../lunote-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
